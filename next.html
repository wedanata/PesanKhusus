<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Untuk Kamu 🤍</title>

  <style>

/* =========================
   RESET + BODY FIX HP
========================= */
html, body{
  height:100%;
  margin:0;
  padding:0;

  overflow-x:hidden;
  overflow-y:hidden;

  font-family:Poppins,sans-serif;
}

/* =========================
   BODY
========================= */
body{

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:linear-gradient(135deg,#ffd6e7,#fff0f5,#ffffff);

  position:relative;
}

/* =========================
   CARD (CENTER FIX)
========================= */
.container{
  position:relative;
  z-index:5;
  padding:20px;
}

.next-card{

  width:100%;
  max-width:420px;

  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(10px);

  padding:30px;

  border-radius:30px;

  text-align:center;

  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* =========================
   EMOJI
========================= */
.big-emoji{
  width:160px;
  animation:float 3s ease-in-out infinite;
}

/* =========================
   TEXT
========================= */
h1{
  color:#ff5c8a;
  font-size:26px;
  margin-bottom:10px;
}

.special-message{
  font-size:16px;
  line-height:1.9;
  color:#555;
}

/* =========================
   MINI HEARTS
========================= */
.mini-hearts{
  margin-top:20px;
  font-size:22px;
  animation:float 2s ease-in-out infinite;
}

/* =========================
   BUBBLE FIX (TIDAK RUSAK HP)
========================= */
.bubble{

  position:fixed;

  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(10px);

  padding:8px 14px;
  border-radius:20px;

  color:#ff5c8a;
  font-size:12px;

  box-shadow:0 5px 15px rgba(0,0,0,0.08);

  animation:float 4s ease-in-out infinite;

  pointer-events:none;

  z-index:2;
}

.bubble1{top:8%;left:5%;}
.bubble2{top:12%;right:5%;}
.bubble3{bottom:10%;left:8%;}

/* =========================
   BUTTON PREMIUM FIX
========================= */
.next-link{
  text-decoration:none;
  display:flex;
  justify-content:center;
}

.next-btn{

  margin-top:25px;

  width:100%;

  padding:14px 25px;

  border:none;
  border-radius:50px;

  font-size:16px;
  font-weight:600;

  color:white;

  cursor:pointer;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;

  background:linear-gradient(135deg,#ff7aa2,#ff4f86);

  box-shadow:0 12px 25px rgba(255,92,138,0.35);

  transition:all 0.3s ease;

  position:relative;
  overflow:hidden;
}

/* hover desktop */
.next-btn:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 18px 35px rgba(255,92,138,0.45);
}

/* shine effect */
.next-btn::before{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.25);
  transform:skewX(-20deg);
  transition:0.5s;
}

.next-btn:hover::before{
  left:120%;
}

/* =========================
   ANIMASI FLOAT
========================= */
@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}

/* =========================
   RESPONSIVE HP
========================= */
@media (max-width:480px){

  .next-card{
    width:100%;
    padding:25px;
  }

  .big-emoji{
    width:130px;
  }

  h1{
    font-size:22px;
  }

  .special-message{
    font-size:14px;
  }

}

/* =========================
   HEART ANIMATION (SAFE)
========================= */
.heart{
  position:fixed;
  top:-10vh;
  pointer-events:none;
  animation:fall linear infinite;
  z-index:1;
}

@keyframes fall{
  0%{
    transform:translateY(-10vh);
    opacity:1;
  }
  100%{
    transform:translateY(110vh);
    opacity:0;
  }
}

  </style>
</head>

<body>

  <!-- Bubble -->
  <div class="bubble bubble1">kamu lucu 🥺</div>
  <div class="bubble bubble2">jangan sedih ya 🤍</div>
  <div class="bubble bubble3">aku sayang kamu 🌸</div>

  <!-- Container -->
  <div class="container">

    <div class="next-card">

      <img src="image/emoji.png" class="big-emoji">

      <h1>Hai Kamu 🤍</h1>

      <div class="special-message">

        Makasih ya sudah bertahan sejauh ini 🥺
        <br><br>

        Semoga hari-harimu selalu baik 🌸
        <br><br>

        Dan semoga senyummu tidak pernah hilang ✨

      </div>

      <div class="mini-hearts">🤍 ✨ 🌸 💗</div>

      <a href="slide.html" class="next-link">
        <button class="next-btn">
          Lanjut Lagi <span>➜</span>
        </button>
      </a>

    </div>

  </div>

  <script>

    function createHeart() {

      const heart = document.createElement('span');
      heart.classList.add('heart');

      const emojis = ['🤍','🌸','✨','💗','🥺'];

      heart.innerHTML =
        emojis[Math.floor(Math.random() * emojis.length)];

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 18 + 14) + 'px';
      heart.style.animationDuration = (Math.random() * 3 + 2) + 's';

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 700);

  </script>

</body>
</html>
